name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-cli:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system libraries for Open3D and PyMeshLab
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libglib2.0-0 libgomp1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install package with S2 and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[s2,dev]"

      - name: Run offline unit tests
        run: pytest -v

      - name: Verify CLI entrypoints and Layer-1/Layer-2 profiles
        run: |
          quadvox --help
          quadvox profile-show --profile object
          quadvox profile-show --profile hard_surface_prop
          quadvox profile-show --profile symmetric_humanoid
          quadvox profile-show --profile hard_surface_roi
